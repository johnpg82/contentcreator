<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TheBash.com Reader - Settings</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
      background: #f5f5f5;
    }

    .container {
      background: white;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    h1 {
      margin: 0 0 10px 0;
      color: #333;
      font-size: 24px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 30px;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-weight: 500;
      font-size: 14px;
    }

    input[type="text"],
    input[type="url"] {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      box-sizing: border-box;
      font-family: monospace;
    }

    input:focus {
      outline: none;
      border-color: #4CAF50;
      box-shadow: 0 0 0 2px rgba(76, 175, 80, 0.1);
    }

    .help-text {
      font-size: 12px;
      color: #666;
      margin-top: 5px;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      margin-bottom: 25px;
    }

    input[type="checkbox"] {
      width: 18px;
      height: 18px;
      margin-right: 10px;
      cursor: pointer;
    }

    .checkbox-group label {
      margin-bottom: 0;
      cursor: pointer;
    }

    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 30px;
    }

    button {
      padding: 12px 24px;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s;
    }

    .btn-primary {
      background: #4CAF50;
      color: white;
      flex: 1;
    }

    .btn-primary:hover {
      background: #45a049;
    }

    .btn-secondary {
      background: #f5f5f5;
      color: #333;
    }

    .btn-secondary:hover {
      background: #e0e0e0;
    }

    .status-message {
      padding: 12px;
      border-radius: 4px;
      margin-top: 20px;
      font-size: 14px;
      display: none;
    }

    .status-message.success {
      background: #e8f5e9;
      color: #2e7d32;
      border-left: 4px solid #4CAF50;
      display: block;
    }

    .status-message.error {
      background: #ffebee;
      color: #c62828;
      border-left: 4px solid #f44336;
      display: block;
    }

    .example {
      background: #f9f9f9;
      padding: 10px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 12px;
      margin-top: 8px;
      color: #666;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Settings</h1>
    <p class="subtitle">Configure your Cloudflare Worker endpoint for saving content</p>

    <form id="settingsForm">
      <div class="form-group">
        <label for="workerUrl">Cloudflare Worker URL</label>
        <input
          type="url"
          id="workerUrl"
          placeholder="https://your-worker.your-subdomain.workers.dev"
          autocomplete="off"
        />
        <p class="help-text">
          Enter the URL of your deployed Cloudflare Worker endpoint
        </p>
        <div class="example">
          Example: https://thebash-content-storage.myname.workers.dev
        </div>
      </div>

      <div class="checkbox-group">
        <input type="checkbox" id="autoSave" />
        <label for="autoSave">Automatically save content when visiting thebash.com</label>
      </div>

      <div class="checkbox-group">
        <input type="checkbox" id="showNotifications" />
        <label for="showNotifications">Show notifications when content is saved</label>
      </div>

      <div class="button-group">
        <button type="submit" class="btn-primary">Save Settings</button>
        <button type="button" id="testBtn" class="btn-secondary">Test Connection</button>
      </div>

      <div id="statusMessage" class="status-message"></div>
    </form>
  </div>

  <script src="options.js"></script>
</body>
</html>
