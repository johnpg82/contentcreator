# Cloudflare Workers configuration
name = "thebash-content-storage"
main = "index.js"
compatibility_date = "2024-01-01"

# Uncomment and configure if using D1 Database
# [[d1_databases]]
# binding = "DB"
# database_name = "thebash-content"
# database_id = "your-database-id-here"

# Uncomment and configure if using KV Storage
# [[kv_namespaces]]
# binding = "CONTENT_STORE"
# id = "your-kv-namespace-id-here"

# Environment variables (optional)
# [vars]
# ENVIRONMENT = "production"

# For local development
[env.dev]
# [[env.dev.d1_databases]]
# binding = "DB"
# database_name = "thebash-content-dev"
# database_id = "your-dev-database-id-here"
